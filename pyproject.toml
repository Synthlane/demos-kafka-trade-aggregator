[project]
name = "kafka-trade-aggregator"
version = "0.1.0"
description = "Live trade feed aggregator using Kafka/Redpanda and Binance public WebSocket"
requires-python = ">=3.11,<3.14"
dependencies = [
    "confluent-kafka>=2.3.0",
    "faust-streaming>=0.10.0",
    "aiokafka>=0.11,<0.13",
    "websocket-client>=1.7.0",
    "redis[hiredis]>=5.0.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = []
